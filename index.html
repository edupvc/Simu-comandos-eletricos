<script>
const COLS=['#d33','#27c','#222','#2a8','#e2a400'],W=1800,H=1250,BOT=1225,BRK={QT:3,QB:2,QU:1,QM:3,FT:3},DK='#2b3846';
const TY={SV:{n:'botoeira verde',w:120,h:165,c:'#2c9a4a'},SR:{n:'botoeira vermelha',w:120,h:165,c:'#d33'},K:{n:'contator',w:430,h:380},H:{n:'sinaleira',w:215,h:110},M:{n:'motor 220/380 V',w:215,h:300},QT:{n:'disjuntor 3P',w:190,h:200},QB:{n:'disjuntor 2P',w:150,h:200},QU:{n:'disjuntor 1P',w:110,h:200},QM:{n:'disjuntor motor',w:240,h:200,ax:[['13','14',180],['21','22',220]]},FT:{n:'relé térmico',w:290,h:200,ax:[['95','96',190],['97','98',240]]}};
const NAME={SV:'Botoeira verde',SR:'Botoeira vermelha',K:'Contator',H:'Sinaleira',M:'Motor',QT:'Disjuntor 3P',QB:'Disjuntor 2P',QU:'Disjuntor 1P',QM:'Disjuntor motor',FT:'Relé térmico'};
Object.assign(TY,{HV:{n:'sinaleira verde',w:215,h:110,c:'#2fd05a'},HR:{n:'sinaleira vermelha',w:215,h:110,c:'#ff3b30'},KT:{n:'relé temporizador',w:230,h:280},CS:{n:'chave seletora',w:290,h:200}});
Object.assign(NAME,{HV:'Sinaleira verde',HR:'Sinaleira vermelha',KT:'Relé temporizador',CS:'Chave seletora',H:'Sinaleira amarela'});TY.H.c='#ffd23f';TY.H.n='sinaleira amarela';
function terms(ty){
if(ty==='F')return['R','S','T','N','PE'].map((n,i)=>[n,40,170+45*i]);
if(ty[0]==='S')return[['11',30,95],['12',90,95],['13',30,135],['14',90,135]];
if(ty==='K')return[['A1',40,70],['A2',40,310],...[['1','2',100],['3','4',150],['5','6',200],['13','14',250],['21','22',300],['31','32',350],['43','44',400]].flatMap(([a,b,x])=>[[a,x,70],[b,x,310]])];
if(ty[0]==='H')return[['X1',45,85],['X2',170,85]];
if(ty==='KT')return[['A1',40,70],['A2',40,190],['16',115,70],['18',175,70],['15',175,190]];
if(ty==='CS')return[['11',100,60],['12',100,160],['13',150,60],['14',150,160],['21',200,60],['22',200,160],['23',250,60],['24',250,160]];
if(ty==='M')return[['U1',45,170],['V1',108,170],['W1',170,170],['W2',45,225],['U2',108,225],['V2',170,225],['PE',108,275]];
const n=BRK[ty],t=[];for(let i=0;i<n;i++)t.push([''+(2*i+1),35+45*i,60],[''+(2*i+2),35+45*i,160]);(TY[ty].ax||[]).forEach(([a,b,x])=>t.push([a,x,60],[b,x,160]));return t}
const mods=[],P={},st={on:false,em:false,pr:{},k:{},q:{},tr:{},lv:{},mo:{},md:{},kt:{},sw:{},w:[],sel:null,last:null,selM:null,col:COLS[0],msg:[]};
mods.push({id:'F',ty:'F',x:1610,y:60,w:130,h:380,t:'BANCADA Nº 01',terms:terms('F')});
function upd(){Object.keys(P).forEach(k=>delete P[k]);mods.forEach(m=>m.terms.forEach(([n,dx,dy])=>P[m.id+'.'+n]={x:m.x+dx,y:m.y+dy,n}))}
const fits=(x,y,m)=>!mods.some(o=>o!==m&&x<o.x+o.w+10&&x+m.w+10>o.x&&y<o.y+o.h+10&&y+m.h+10>o.y);
const ROWS=[60,490,740,990],CODE={F:'P001',SV:'P061',SR:'P062',K:'P053',H:'P029',QM:'P068',FT:'P072',QB:'P071',KT:'P058',CS:'P011'};
function place(m){const ys=(m.h>200?ROWS:[...ROWS.slice(1),ROWS[0]]).filter(y=>y+m.h<=BOT);for(let y=60;y+m.h<=BOT;y+=20)ys.push(y);for(const y of ys)for(let x=50;x+m.w<=1740;x+=10)if(fits(x,y,m)){m.x=x;m.y=y;return true}m.x=50;m.y=60;try{lg('Sem espaço livre na bancada: mova ou retire peças')}catch(e){}return false}
function settle(m){if(fits(m.x,m.y,m))return;let b=null,bd=1e9;for(let y=50;y+m.h<=BOT;y+=10)for(let x=40;x+m.w<=W-40;x+=10)if(fits(x,y,m)){const d=(x-m.x)**2+(y-m.y)**2;if(d<bd){bd=d;b=[x,y]}}if(b){m.x=b[0];m.y=b[1];lg(m.id+' ajustada para não ficar sobre outra peça')}}
function add(ty){let n=1;while(mods.some(m=>m.id===ty+n))n++;const d=TY[ty],m={id:ty+n,ty,w:d.w,h:d.h,t:ty+n+' '+d.n,terms:terms(ty),x:-999,y:-999};place(m);mods.push(m);if(BRK[ty])st.q[m.id]=true;return m}
function del(ty){const l=mods.filter(m=>m.ty===ty).pop();if(!l)return;mods.splice(mods.indexOf(l),1);st.w=st.w.filter(w=>!w.a.startsWith(l.id+'.')&&!w.b.startsWith(l.id+'.'));[st.k,st.q,st.tr,st.pr,st.kt,st.sw].forEach(o=>delete o[l.id]);if(st.selM===l.id)st.selM=null;lg(l.t+' retirada')}
['SV','SR','K','H','M','QT','QB','QU','QM','FT'].forEach(add);
function contacts(){const c=[],I=(i,a,b)=>c.push([i+'.'+a,i+'.'+b]);
mods.forEach(({id:i,ty})=>{
if(ty[0]==='S')st.pr[i]?I(i,13,14):I(i,11,12);
else if(ty==='K'){if(st.k[i]){I(i,1,2);I(i,3,4);I(i,5,6);I(i,13,14);I(i,43,44)}else{I(i,21,22);I(i,31,32)}}
else if(ty==='CS'){st.sw[i]?(I(i,13,14),I(i,23,24)):(I(i,11,12),I(i,21,22))}
else if(ty==='KT'){st.kt[i]&&st.kt[i].d?I(i,15,18):I(i,15,16)}
else if(ty==='FT'){I(i,1,2);I(i,3,4);I(i,5,6);st.tr[i]?I(i,97,98):I(i,95,96)}
else if(BRK[ty]){const on=st.q[i];if(on)for(let j=1;j<=BRK[ty];j++)I(i,2*j-1,2*j);if(ty==='QM')on?I(i,13,14):I(i,21,22)}});return c}
let C;
function calc(){const p={};const f=x=>{if(p[x]===undefined)p[x]=x;return p[x]===x?x:(p[x]=f(p[x]))};
const u=(a,b)=>{p[f(a)]=f(b)};st.w.forEach(w=>u(w.a,w.b));contacts().forEach(([a,b])=>u(a,b));
const L={};const add=(t,l)=>{const r=f(t);(L[r]=L[r]||new Set()).add(l)};
add('F.PE','PE');if(st.on&&!st.em)['R','S','T','N'].forEach(x=>add('F.'+x,x));
const sg=t=>{const s=L[f(t)];if(!s||s.size!==1)return null;const v=[...s][0];return v==='PE'?null:v};
const vo=(a,b)=>{const x=sg(a),y=sg(b);if(!x||!y||x===y)return 0;return(x==='N'||y==='N')?127:220};
C={f,L,sg,vo}}
function run(){for(let i=0;i<30;i++){calc();let ch=false;mods.filter(m=>m.ty==='K').forEach(m=>{const k=C.vo(m.id+'.A1',m.id+'.A2')===220;if(!!st.k[m.id]!==k){st.k[m.id]=k;ch=true}});mods.filter(m=>m.ty==='KT').forEach(m=>{const k=st.kt[m.id]||(st.kt[m.id]={e:false,d:false,t0:0}),c=C.vo(m.id+'.A1',m.id+'.A2')===220;if(c&&!k.e){k.e=true;k.t0=Date.now();k.d=false;ch=true}else if(!c&&k.e){k.e=false;k.d=false;ch=true}});
if(!ch)break}}
function mot(i){const T=n=>i+'.'+n,w=['U','V','W'].map(x=>C.vo(T(x+'1'),T(x+'2')));
const lab=new Set(['U1','V1','W1','U2','V2','W2'].map(t=>C.sg(T(t))).filter(Boolean)),ph=['R','S','T'].every(x=>lab.has(x));
const u2=C.f(T('U2')),a=['U1','V1','W1'].map(t=>C.sg(T(t)));
const stp=u2===C.f(T('V2'))&&u2===C.f(T('W2'))&&!C.L[u2]&&a.every(x=>['R','S','T'].includes(x))&&new Set(a).size===3;
return w.every(x=>x===220)&&ph?'run':stp?'weak':w.some(x=>x>0)?'part':'off'}
function solve(){run();st.msg=[];
if(Object.values(C.L).some(s=>s.size>1)){st.on=false;st.k={};st.kt={};run();st.msg.push('<span class="bad">CURTO-CIRCUITO! O disjuntor desarmou. Remova o erro e ligue a chave de novo.</span>')}
st.msg.unshift(!st.on?'Bancada desligada (chave em 0).':st.em?'Botão de emergência acionado: nada é energizado.':'Bancada energizada.');
mods.forEach(m=>{const i=m.id;
if(m.ty==='K'){const v=C.vo(i+'.A1',i+'.A2');if(v===127)st.msg.push(i+': bobina com 127 V não aciona (precisa de 220 V).')}
if(m.ty[0]==='H'){st.lv[i]=C.vo(i+'.X1',i+'.X2');if(st.lv[i]===127)st.msg.push(i+': 127 V, brilho fraco.')}
if(m.ty==='M'){st.mo[i]=mot(i);st.md[i]=['RST','STR','TRS'].includes(['U1','V1','W1'].map(t=>C.sg(i+'.'+t)).join(''))?1:-1;const s=st.mo[i];if(s==='run')st.msg.push(i+' girando: triângulo, 220 V, sentido '+(st.md[i]>0?'direto':'reverso')+'.');if(s==='weak')st.msg.push(i+' em estrela com 220 V: 127 V por bobina, gira fraco.');if(s==='part')st.msg.push(i+': alimentação incompleta, confira U, V e W.')}
if(m.ty==='KT'&&st.kt[i]&&st.kt[i].e)st.msg.push(i+(st.kt[i].d?' temporizou: contato 15-18 fechou.':' contando o tempo...'));
if(m.ty==='FT'&&st.tr[i])st.msg.push(i+' desarmado: 95-96 abriu e 97-98 fechou.')});
const ek=mods.filter(m=>st.k[m.id]).map(m=>m.id);if(ek.length)st.msg.push('Energizado: '+ek.join(', '));
draw()}
const $=id=>document.getElementById(id);
let us=[],ur=[],z=1,rq=0;
const snap=()=>JSON.stringify({m:mods.map(m=>({id:m.id,ty:m.ty,x:m.x,y:m.y,dly:m.dly})),sw:st.sw,w:st.w,on:st.on,em:st.em,q:st.q,tr:st.tr});
const btns=()=>{$('un').disabled=!us.length;$('re').disabled=!ur.length};
function cp(){us.push(snap());if(us.length>80)us.shift();ur=[];btns()}
function load(j){const o=JSON.parse(j);mods.length=0;o.m.forEach(r=>{const d=r.ty==='F'?{w:130,h:380,n:''}:TY[r.ty];mods.push({id:r.id,ty:r.ty,x:r.x,y:r.y,dly:r.dly,w:d.w,h:d.h,t:r.ty==='F'?'BANCADA Nº 01':r.id+' '+d.n,terms:terms(r.ty)})});st.w=o.w;st.on=o.on;st.em=o.em;st.q=o.q;st.tr=o.tr;st.sw=o.sw||{};st.kt={};st.k={};st.pr={};st.sel=null;st.selM=null;solve()}
function undo(){if(!us.length)return;ur.push(snap());load(us.pop());lg('Desfeito');btns()}
function redo(){if(!ur.length)return;us.push(snap());load(ur.pop());lg('Refeito');btns()}
const lg=t=>{const l=$('log');l.innerHTML+=new Date().toLocaleTimeString().slice(0,8)+' '+t+'<br>';l.scrollTop=l.scrollHeight};
const pt=e=>{const v=$('s'),r=v.getBoundingClientRect(),b=v.viewBox.baseVal;return{x:(e.clientX-r.left)*b.width/r.width,y:(e.clientY-r.top)*b.height/r.height}};
const pos=(a,b)=>{const A=P[a],B=P[b];return`M${A.x} ${A.y}Q${(A.x+B.x)/2} ${(A.y+B.y)/2+45+Math.abs(A.x-B.x)/6} ${B.x} ${B.y}`};
const ln=(x,y1,y2)=>`<path d="M${x} ${y1}V${y2}" stroke="${DK}" stroke-width="3" fill="none"/>`;
function body(m){const X=d=>m.x+d,Y=d=>m.y+d,ty=m.ty,i=m.id;let h='';
if(ty==='F')h+=`<g data-act="on" style="cursor:pointer"><rect x="${X(30)}" y="${Y(40)}" width="90" height="28" rx="5" fill="${st.on?'#2a8':'#f4f7fa'}" stroke="${DK}"/><text x="${X(75)}" y="${Y(59)}" font-size="12" text-anchor="middle" ${st.on?'style="fill:#fff"':''}>Chave ${st.on?1:0}</text></g><g data-act="em" style="cursor:pointer"><circle cx="${X(65)}" cy="${Y(102)}" r="22" fill="${st.em?'#6a0f0f':'#d22'}" stroke="#ec0" stroke-width="5"/></g><text x="${X(65)}" y="${Y(138)}" font-size="10" text-anchor="middle">Emergência${st.em?' (apertada)':''}</text>`;
else if(ty[0]==='S')h+=`<g data-btn="${i}" style="cursor:pointer"><circle cx="${X(60)}" cy="${Y(48)}" r="25" fill="#16181b"/><circle cx="${X(60)}" cy="${Y(48)}" r="${st.pr[i]?15:18}" fill="${TY[ty].c}" stroke="#111" stroke-width="5"/></g><text x="${X(60)}" y="${Y(75)}" font-size="10" text-anchor="middle">NF 11-12</text><text x="${X(60)}" y="${Y(119)}" font-size="10" text-anchor="middle">NA 13-14</text>`;
